name: 文書の指摘・提案
description: README・更新手順・検証記録などの文書に関する指摘・提案をする
title: '[Docs] '
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |-
        FutatsumeWatchに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。署名付き配信URLと証明書秘密鍵も伏せてください。
        投稿前に[README](https://github.com/roflsunriz/FutatsumeWatch/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/FutatsumeWatch/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/FutatsumeWatch/blob/main/SECURITY.md)の案内に従ってください。
  - type: markdown
    attributes:
      value: Cookie・認証トークン・署名付き配信URL・個人情報を貼らないでください。
  - type: input
    id: target
    attributes:
      label: 対象文書
      description: 'ファイル名と該当する見出しや手順番号（例: how-to-update.md「ビルドと検証」）'
      placeholder: README.md「使い方」
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 現在の記載と問題
      description: 現在の記載と実際の実装・設定・手順との差を書く
      placeholder: '...'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期待する記載
      description: 可能なら具体的な文案や参照先を書く
      placeholder: '...'
    validations:
      required: false
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 根拠となる資料や、試した環境と結果を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
