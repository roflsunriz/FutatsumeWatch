# ラベル付け規則
# PR の変更ファイルに応じてラベルを付ける

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - CHANGELOG.md
          - README.md
          - how-to-update.md
          - verification.md
          - docs/**/*
          - .github/ISSUE_TEMPLATE/**/*
          - .github/DISCUSSION_TEMPLATE/**/*
          - .github/PULL_REQUEST_TEMPLATE.md

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - bun.lock

build:
  - changed-files:
      - any-glob-to-any-file:
          - vite.config.mts
          - scripts/build.ts
          - dist/**/*

test:
  - changed-files:
      - any-glob-to-any-file:
          - test/**/*
          - scripts/test-browser.ts
          - scripts/dev-verify*.ts
          - scripts/verify-*.ts

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**/*
          - .github/dependabot.yml
          - .github/labeler.yml
